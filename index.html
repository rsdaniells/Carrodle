<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carrodle</title>
<style>
:root{--bg:#f4f4f1;--card:#fff;--tx:#1b1b1b;--mut:#6b6b66;--ac:#d62828;--ok:#2a9d4f;--bd:#e0e0da;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141414;--card:#1f1f1f;--tx:#f0f0ec;--mut:#9a9a94;--ac:#ff5a5a;--ok:#4cc27a;--bd:#333}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;justify-content:center;padding:16px}
main{width:100%;max-width:520px}
h1{font-size:1.5rem;margin:8px 0 2px}
.sub{color:var(--mut);margin:0 0 16px;font-size:.95rem}
.top{display:flex;justify-content:space-between;color:var(--mut);font-size:.9rem;margin-bottom:8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:6px 16px}
.row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border-bottom:0}
.row span:first-child{color:var(--mut)}
.row b{text-align:right}
.hid{color:var(--mut);letter-spacing:2px}
.in{display:flex;gap:8px;margin-top:16px}
input,textarea{flex:1;min-width:0;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:1rem;font-family:inherit}
textarea{width:100%;margin-top:8px;height:110px}
button{padding:12px 16px;border:0;border-radius:10px;font-size:1rem;cursor:pointer;background:var(--ac);color:#fff;font-weight:600}
button.sec{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
button:disabled{opacity:.5;cursor:default}
.btns{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.btns button{flex:1;min-width:140px}
.big{display:block;width:100%;text-align:left;margin-top:10px;padding:16px}
.big small{display:block;font-weight:400;opacity:.85;margin-top:2px}
#msg{margin-top:14px;min-height:1.4em;font-weight:600}
.ok{color:var(--ok)}.bad{color:var(--ac)}
.wrong{color:var(--mut);font-size:.9rem;margin-top:6px}
.lvl{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0 4px}
.lvl button{padding:10px 4px;font-size:.9rem;background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.lvl button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
input[type=checkbox]{flex:none;width:18px;height:18px;padding:0}
.chk{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:.9rem;margin:4px 0 8px}
.foot{text-align:center;color:var(--mut);font-size:.8rem;margin:28px 0 8px}
.stats{padding:12px 16px;margin:0 0 12px;font-size:.95rem;line-height:1.6}
.h2{font-size:1.2rem;margin:8px 0 4px}
.foot a{color:inherit;text-decoration:underline}
.pl{padding:6px 12px;font-size:.85rem;margin-left:8px}
.bk{padding:8px 12px;font-size:.9rem;margin-bottom:10px}
.hide{display:none!important}
</style>
</head>
<body>
<main>
<h1>🏎️ Carrodle</h1>
<p class="sub" style="margin-bottom:6px">Que carro sou eu?</p>

<section id="menu">
<div class="card stats" id="stats"></div>
<p class="sub">Descubra o carro com poucas dicas: ano, valor médio, estilo, motor, câmbio e mais.</p>
<div class="lvl" id="lvl"></div>
<p class="sub" id="lvInfo"></p>
<label class="chk"><input type="checkbox" id="sug" checked> Mostrar sugestões de nomes ao digitar</label>
<button class="big" id="mDaily">📅 Carro do dia<small>O mesmo desafio para todo mundo hoje. Jogue quando quiser, e depois jogue o modo completo também.</small></button>
<button class="big sec" id="mPast">🗓️ Dias anteriores<small>Jogue os carros do dia que você perdeu</small></button>
<button class="big" id="mAll">🏁 Todos os carros do nível<small id="mAllSub"></small></button>
<button class="big sec" id="mShare">📣 Divulgar o jogo<small>Convide amigos para jogar</small></button>
</section>

<section id="past" class="hide">
<h2 class="h2">🗓️ Dias anteriores</h2>
<p class="sub" id="pastInfo"></p>
<div class="card" id="pastList"></div>
<div class="btns"><button class="sec" id="pastBack">Voltar ao menu</button></div>
</section>

<section id="game" class="hide">
<button class="sec bk" id="topBack">← Menu</button>
<div class="top"><span id="rd"></span><span id="pt"></span></div>
<div class="card" id="clues"></div>
<div class="in">
<input id="g" list="cars" placeholder="Digite o nome do carro (ex: Gol GTi)" autocomplete="off">
<button id="go">Chutar</button>
</div>
<datalist id="cars"></datalist>
<div class="btns"><button class="sec" id="hint">Mais uma dica (−1)</button><button class="sec" id="skip">Desistir</button></div>
<div id="msg"></div>
<div class="wrong" id="wr"></div>
<div class="btns" id="after">
<button id="next" class="hide"></button>
<button id="share" class="hide">📤 Compartilhar resultado</button>
<button id="back" class="sec hide">Voltar ao menu</button>
</div>
<textarea id="ta" class="hide" readonly></textarea>
</section>
<footer class="foot">Feito por <a href="https://www.instagram.com/rsdaniells" target="_blank" rel="noopener noreferrer">Daniel Reis</a> com Claude</footer>
</main>

const START=2; let ROUNDS;
const cl=c=>ORDER.map((k,i)=>[LABELS[i],c[k]]).filter(x=>x[1]!==""&&x[1]!=null);
const maxPts=c=>Math.max(1,cl(c).length+1-START);
const totalMax=()=>deck.reduce((t,c)=>t+maxPts(c),0);
const LEVELS=[
 {n:1,name:"Fácil",desc:"Marcas mais populares (Fiat, Chevrolet, Ford, VW, Honda, Hyundai, Jeep, Nissan, Kia, BYD...) em modelos atuais"},
 {n:2,name:"Médio",desc:"As mesmas marcas, incluindo modelos antigos e fora de linha"},
 {n:3,name:"Difícil",desc:"Soma as marcas de luxo (BMW, Mercedes, Audi, Porsche, Ferrari...)"},
 {n:4,name:"Expert",desc:"Todos os tipos de carros e marcas"}];
let LEVEL=1;
const pool=()=>{const p=CARS.filter(c=>c[9]<=LEVEL);return p.length?p:CARS};
const lvName=()=>LEVELS[LEVEL-1].name;
const names=c=>c[0].split("|").map(x=>x.trim());
const label=c=>names(c)[0];
const full=c=>(c[10]?c[10]+" ":"")+label(c);
const isMatch=(c,v)=>{const nv=norm(v);return names(c).some(n=>norm(n)===nv||(c[10]&&norm(c[10]+" "+n)===nv))};
const $=id=>document.getElementById(id);
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]/g,"");
const show=(id,v)=>$(id).classList.toggle("hide",!v);
// ---- Ofensivas e dias anteriores (ficam salvos no navegador de cada jogador) ----
let S={days:{},back:{}};
try{const t=localStorage.getItem("carrodle_v1");if(t){const o=JSON.parse(t);S={days:o.days||{},back:o.back||{}}}}catch(e){}
const saveS=()=>{try{localStorage.setItem("carrodle_v1",JSON.stringify(S))}catch(e){}};
const dayN=d=>Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5);
const todayN=()=>dayN(new Date());
const dkey=n=>new Date(n*864e5).toISOString().slice(0,10);
const dfmt=n=>{const [y,m,d]=dkey(n).split("-");return `${d}/${m}/${y}`};
const LAUNCH=dayN(new Date(2026,9,17)); // data de lançamento (17/10/2026): os dias anteriores só existem a partir dela
function stats(){const ds=Object.keys(S.days).filter(k=>Object.keys(S.days[k]).length).sort();
 const set=new Set(ds);let t=todayN(),cur=0;if(!set.has(dkey(t)))t--;
 while(set.has(dkey(t))){cur++;t--}
 let best=0,run=0,prev=null;
 for(const k of ds){const n=Date.parse(k+"T00:00:00Z")/864e5;run=(prev!==null&&n===prev+1)?run+1:1;if(run>best)best=run;prev=n}
 return {cur,best,total:ds.length,today:set.has(dkey(todayN()))}}
function renderStats(){const s=stats();
 $("stats").innerHTML=`🔥 <b>${s.cur}</b> dia${s.cur===1?"":"s"} seguido${s.cur===1?"":"s"} &nbsp;·&nbsp; 🏆 recorde <b>${s.best}</b> &nbsp;·&nbsp; 📅 <b>${s.total}</b> dia${s.total===1?"":"s"} jogado${s.total===1?"":"s"}<br><span style="color:var(--mut)">${s.today?"Você já jogou o carro do dia hoje. Volte amanhã para manter a ofensiva!":(s.cur>0?"Jogue o carro do dia hoje para manter sua ofensiva!":"Jogue o carro do dia para começar sua ofensiva!")}</span>`}
function recordDaily(win){const k=dkey(dayNum),lv=String(LEVEL),r=win?"W":"L";
 if(dayNum===todayN()){S.days[k]=S.days[k]||{};if(!S.days[k][lv])S.days[k][lv]=r}
 else if(!S.back[k+"|"+lv])S.back[k+"|"+lv]=r;
 saveS();renderStats();
 if(dayNum===todayN())$("msg").textContent+=` · 🔥 Ofensiva: ${stats().cur}`}
function openPast(){const t=todayN(),lv=String(LEVEL);let h="";
 for(let n=t-1;n>=Math.max(LAUNCH,t-59);n--){const k=dkey(n);const r=(S.days[k]&&S.days[k][lv])||S.back[k+"|"+lv];
  const ic=r==="W"?"✅":r==="L"?"❌":"⚪";
  const wd=new Date(n*864e5).toLocaleDateString("pt-BR",{weekday:"short",timeZone:"UTC"});
  h+=`<div class="row"><span>${dfmt(n)} · ${wd}</span><span>${ic}<button class="sec pl" data-n="${n}">${r?"Jogar de novo":"Jogar"}</button></span></div>`}
 $("pastList").innerHTML=h||'<div class="row"><span>Ainda não há dias anteriores. Volte amanhã!</span></div>';
 $("pastInfo").textContent=`Nível ${lvName()} (troque no menu). ✅ acertou · ❌ errou · ⚪ ainda não jogou. Dias anteriores não contam para a ofensiva.`;
 show("menu",false);show("past",true)}
function setup(){renderStats();const P=pool();ROUNDS=Math.min(8,P.length);
 $("lvl").innerHTML=LEVELS.map(l=>`<button data-n="${l.n}" class="${l.n===LEVEL?"on":""}">${l.name}</button>`).join("");
 $("lvInfo").textContent=`${LEVELS[LEVEL-1].desc} · ${P.length} carro${P.length>1?"s":""} neste nível`;
 $("cars").innerHTML=[...new Set(P.map(label))].sort((x,y)=>x.localeCompare(y,"pt")).map(n=>`<option value="${n}">`).join("");
 $("mAllSub").textContent=`${ROUNDS} rodada${ROUNDS>1?"s":""} com carros sorteados e pontuação`}
$("sug").onchange=()=>{if($("sug").checked)$("g").setAttribute("list","cars");else $("g").removeAttribute("list")};
$("lvl").onclick=e=>{const b=e.target.closest("button");if(b){LEVEL=+b.dataset.n;setup()}};
setup();
let mode,deck,idx,car,shown,score,over,steps,hist,fails,dayNum,fromPast=false;

// Carro do dia: ordem fixa e embaralhada (pelo nome e ano), escolhida pelo número do dia. Adicionar carros muda a sequência dos dias.
const hh=s=>{let x=5381;for(const ch of s)x=((x*33)^ch.charCodeAt(0))>>>0;return x};
function dayCar(n){const p=[...pool()].sort((a,b)=>hh(a[0]+a[1])-hh(b[0]+b[1]));return p[((n%p.length)+p.length)%p.length]}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function startMode(m,n){mode=m;score=0;idx=0;hist=[];dayNum=n==null?todayN():n;fromPast=n!=null;
 $("topBack").textContent=fromPast?"← Dias anteriores":"← Menu";$("back").textContent=fromPast?"Voltar aos dias anteriores":"Voltar ao menu";
 deck=m==="daily"?[dayCar(dayNum)]:shuffle(pool()).slice(0,ROUNDS);
 show("menu",false);show("game",true);load()}
function load(){car=deck[idx];shown=START;over=false;steps="";fails=0;
 $("rd").textContent=mode==="daily"?`${dayNum===todayN()?"Carro do dia":"Dia anterior"} · ${dfmt(dayNum)} · ${lvName()}`:`Rodada ${idx+1}/${deck.length} · ${lvName()}`;
 $("pt").textContent=mode==="daily"?"":`Pontos: ${score}`;
 $("msg").textContent="";$("msg").className="";$("wr").textContent="";$("g").value="";
 ["g","go","hint","skip"].forEach(i=>$(i).disabled=false);
 ["next","share","back"].forEach(i=>show(i,false));show("ta",false);render()}
function render(){const L=cl(car);$("clues").innerHTML=L.map((x,i)=>`<div class="row"><span>${x[0]}</span>${i<shown||over?`<b>${x[1]}</b>`:`<span class="hid">••••••</span>`}</div>`).join("");
 $("hint").disabled=over||shown>=L.length}
function finish(win,pts){over=true;steps+=win?"🟩":"⬛";shown=cl(car).length;render();
 ["g","go","hint","skip"].forEach(i=>$(i).disabled=true);
 if(win){score+=pts;$("msg").textContent=`✅ Acertou! ${full(car)}${mode==="all"?` (+${pts} pts)`:""}`;$("msg").className="ok"}
 else{$("msg").textContent=`❌ Era o ${full(car)}`;$("msg").className="bad"}
 hist.push(win?"🟩":"🟥");
 if(mode==="daily")recordDaily(win);
 if(mode==="all")$("pt").textContent=`Pontos: ${score}`;
 const last=mode==="daily"||idx===deck.length-1;
 if(!last){$("next").textContent="Próximo carro";show("next",true)}
 else{ if(mode==="all"){$("msg").textContent+=` · Fim! ${score}/${totalMax()} pts`}
  show("share",true);show("back",true)}}
function wrong(txt){fails++;steps+="🟥";shown=Math.min(shown+1,cl(car).length);render();if(txt)$("wr").textContent=txt}

$("go").onclick=()=>{const v=$("g").value.trim();if(!v)return;
 const nv=norm(v);
 const cand=[...new Set(pool().filter(c=>names(c).some(n=>norm(n).includes(nv))).map(label))];
 const partial=nv.length>=4&&cand.length===1&&cand[0]===label(car);
 if(isMatch(car,v)||partial)finish(true,Math.max(1,cl(car).length+1-shown));
 else{wrong(`"${v}" não é. Uma dica nova foi revelada (−1).`);$("g").value=""}};
$("g").onkeydown=e=>{if(e.key==="Enter")$("go").click()};
$("hint").onclick=()=>wrong();
$("skip").onclick=()=>finish(false,0);
$("next").onclick=()=>{idx++;load()};
const goBack=()=>{show("game",false);if(fromPast)openPast();else{show("menu",true);renderStats()}};
$("back").onclick=goBack;$("topBack").onclick=goBack;
$("mPast").onclick=openPast;
$("pastBack").onclick=()=>{show("past",false);show("menu",true)};
$("pastList").onclick=e=>{const b=e.target.closest("button");if(b){show("past",false);startMode("daily",+b.dataset.n)}};
$("mDaily").onclick=()=>startMode("daily");
$("mAll").onclick=()=>startMode("all");

const SITE=location.href.split("#")[0];
async function send(text,withUrl=true){
 const full=text+(withUrl?`\n${SITE}`:"");
 try{if(navigator.share){await navigator.share({text:full});return}}catch(e){if(e&&e.name==="AbortError")return}
 try{await navigator.clipboard.writeText(full);$("wr").textContent="Texto copiado! Cole onde quiser.";return}catch(e){}
 const t=$("ta");t.value=full;show("ta",true);t.select();$("wr").textContent="Copie o texto abaixo e compartilhe."}
$("share").onclick=()=>{
 if(mode==="daily"){const w=steps.endsWith("🟩");const n=steps.length/2;const st=stats(),isT=dayNum===todayN();
  send(`🏎️ Carrodle ${isT?"📅":"🗓️ dia anterior"} ${dfmt(dayNum)} · nível ${lvName()}${isT&&st.cur>1?` · 🔥${st.cur}`:""}\n${steps}\n${w?`Descobri o carro do dia com ${n} tentativa${n>1?"s":""}/dica${n>1?"s":""}!`:"Não consegui descobrir o carro do dia. Consegue?"}`)}
 else send(`🏎️ Carrodle Nível ${lvName()}\n${hist.join("")}\nFiz ${score}/${totalMax()} pontos. Consegue me superar?`)};
$("mShare").onclick=()=>{show("ta",false);send("🏎️ Carrodle Descubra o carro com poucas dicas: ano, valor médio, motor, câmbio e mais. Vem jogar!")};

// Carrega a lista de carros do arquivo carros.csv (na mesma pasta do site). Se não achar, usa a lista acima.
function parseCSV(t){t=t.replace(/^\uFEFF/,"");
 const first=t.split(/\r?\n/)[0]||"";
 const d=(first.match(/;/g)||[]).length>(first.match(/,/g)||[]).length?";":",";
 const rows=[];let row=[],cur="",q=false;
 for(let i=0;i<t.length;i++){const c=t[i];
  if(q){if(c==='"'){if(t[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}
  else if(c==='"')q=true;
  else if(c===d){row.push(cur);cur=""}
  else if(c==="\n"){row.push(cur);rows.push(row);row=[];cur=""}
  else if(c!=="\r")cur+=c}
 if(cur!==""||row.length){row.push(cur);rows.push(row)}
 return rows.map(r=>r.map(x=>x.trim())).filter(r=>r.length>=9&&r[0]&&/^\d{4}$/.test(r[1])).map(r=>{r=r.slice(0,12);r[1]=+r[1];r[9]=[1,2,3,4].includes(+r[9])?+r[9]:2;r[10]=r[10]||"";r[11]=r[11]||"";return r})}
fetch("carros.csv",{cache:"no-store"}).then(r=>r.ok?r.text():Promise.reject()).then(t=>{const rows=parseCSV(t);if(rows.length){CARS=rows;setup()}}).catch(()=>{});
